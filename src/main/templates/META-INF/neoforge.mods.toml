modLoader="javafml"

loaderVersion="${loader_version_range}"

license="${mod_license}"

[[mods]]

modId="${mod_id}"

version="${mod_version}"

displayName="${mod_name}"

logoFile="assets/origins/textures/item/orb_of_origin/default/orb_of_origin.png"
catalogueItemIcon="origins:orb_of_origin"

authors="Overgrown"

description='''
Adds the Origins system on top of the Apoli library: origins, layers, choose-on-first-join screen, and the Orb of Origin. Power types, actions, and conditions are supplied by Apoli.
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="apoli"
    type="required"
    versionRange="[1.123.0,)"
    ordering="AFTER"
    side="BOTH"
