plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

repositories {
	mavenCentral()
	mavenLocal()
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Apoli — pulled from the sibling repo published to the local maven cache.
	// Run `./gradlew publishToMavenLocal` on Apoli-Fabric-1.21.1 first.
	modImplementation "dev.overgrown.apoli:apoli:${project.apoli_version}"
}

loom {
	runs {
		// Pin the dev client to a fixed username so every `runClient` launch is the SAME player
		// (same offline UUID -> same playerdata save). Without this, Loom hands the dev client a
		// random "PlayerNNN" each launch, so every relaunch is a brand-new player with no chosen
		// origin — which looks exactly like "the origin reset on restart". NeoForge's runtime
		// already uses a fixed "Dev" account, which is why this only showed up on Fabric.
		client {
			programArgs("--username", "Dev")
		}
	}
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}
	repositories {}
}
