# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=1.20.1
loader_version=0.19.3
loom_version=1.17-SNAPSHOT

# Mod Properties
mod_version=1.24.0
maven_group=dev.overgrown.origins

# Dependencies
fabric_api_version=0.92.11+1.20.1
# Loader+MC-qualified Apoli coordinate (see Apoli-Fabric-1.20.1/gradle.properties maven_version).
apoli_version=wc4HFv44
# Build against a locally published Apoli (dev.overgrown.apoli:apoli:<apoli_maven_version> in ~/.m2)
# instead of the Modrinth release. Keep true while Apoli and Origins are changed in lockstep.
apoli_local=true
apoli_maven_version=1.45.2+1.20.1-fabric

modmenu_version=7.2.2
