# Mod Properties
mod_version=1.25.2
maven_group=dev.overgrown.origins

# Dependencies
fabric_api_version=0.116.15+1.21.1
# Loader+MC-qualified Apoli coordinate (see Apoli-Fabric-1.21.1/gradle.properties maven_version).
apoli_version=VjuCOhC9
# Build against a locally published Apoli (dev.overgrown.apoli:apoli:<apoli_maven_version> in ~/.m2)
# instead of the Modrinth release. Keep true while Apoli and Origins are changed in lockstep.
apoli_local=true
apoli_maven_version=1.51.0+1.21.1-fabric

modmenu_version=11.0.3